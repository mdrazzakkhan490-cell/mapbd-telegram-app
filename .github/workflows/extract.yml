name: Extract App ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "MapBD-Telegram-MiniApp-Ready.zip"

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o MapBD-Telegram-MiniApp-Ready.zip -d extracted

          shopt -s dotglob
          cp -r extracted/* .

          rm -rf extracted
          rm -f MapBD-Telegram-MiniApp-Ready.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract app files"
          git push
